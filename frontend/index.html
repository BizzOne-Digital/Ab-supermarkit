<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AB's Supermarket</title>
    <meta name="description" content="AB's Supermarket - Fresh groceries, great prices, delivered." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700;800&family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>

    <div id="initial-loader" style="
      position: fixed; inset: 0; z-index: 99999;
      background: #090F12;
      display: flex; align-items: center; justify-content: center; flex-direction: column;
      gap: 20px;
      transition: opacity 0.5s ease;
    ">
      <img src="/logo.png" alt="AB's Supermarket" style="
        width: 120px; height: auto;
        animation: ab-pulse 1.6s ease-in-out infinite;
      " />
      <div style="
        width: 36px; height: 36px;
        border: 3px solid rgba(201,154,53,0.25);
        border-top-color: #C99A35;
        border-radius: 50%;
        animation: ab-spin 0.9s linear infinite;
      "></div>
    </div>

    <style>
      @keyframes ab-spin { to { transform: rotate(360deg); } }
      @keyframes ab-pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.75; transform: scale(0.96); }
      }
    </style>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
